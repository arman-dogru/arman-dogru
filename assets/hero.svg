<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Arman Doğru · ArmanOS</title>
  <desc id="hero-desc">Arman's terminal, with an animated cursor exploring his journey, projects, research, and Morpheus. Log in. Look around.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b0b14"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <radialGradient id="glow" cx=".8" cy=".3" r=".7">
      <stop stop-color="#cba6f7" stop-opacity=".08"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#89dceb" stroke-opacity=".035"/>
    </pattern>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .cursor { animation: blink 1.2s step-end infinite; }
      .selection { animation: explore 16s step-end infinite; }
      .command { opacity: 0; animation: command 16s step-end infinite; }
      .projects { animation-delay: -12s; }
      .research { animation-delay: -8s; }
      .chat { animation-delay: -4s; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes explore {
        0%, 100% { transform: translateY(0); }
        25% { transform: translateY(40px); }
        50% { transform: translateY(80px); }
        75% { transform: translateY(120px); }
      }
      @keyframes command { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .selection, .command { animation: none; }
        .journey { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="440" rx="20" fill="url(#background)"/>
  <rect width="1200" height="440" rx="20" fill="url(#glow)"/>
  <rect x="18" y="18" width="1164" height="404" rx="14" fill="url(#grid)" stroke="#313244"/>
  <path d="M18 68H1182" stroke="#313244"/>

  <g aria-hidden="true">
    <circle cx="45" cy="43" r="5" fill="#f38ba8"/>
    <circle cx="65" cy="43" r="5" fill="#f9e2af"/>
    <circle cx="85" cy="43" r="5" fill="#a6e3a1"/>
  </g>
  <text x="110" y="49" fill="#9399b2" font-size="15">arman@dogru: ~</text>
  <circle cx="1076" cy="43" r="4" fill="#a6e3a1"/>
  <text x="1091" y="48" fill="#a6e3a1" font-size="13">ONLINE</text>

  <text x="52" y="120" fill="#9399b2" font-size="17">$ whoami</text>
  <text x="52" y="184" fill="#cdd6f4" font-size="52" font-weight="700">Arman Doğru</text>
  <text x="52" y="224" fill="#89dceb" font-size="18">Applied AI Researcher @ Nokia Bell Labs</text>
  <text x="52" y="258" fill="#a6adc8" font-size="16">Digital twins · Vision · Multi-agent systems</text>

  <rect x="52" y="294" width="540" height="62" rx="8" fill="#11111b" stroke="#45475a"/>
  <text x="72" y="333" fill="#a6e3a1" font-size="24">$ ./ArmanOS</text>
  <rect class="cursor" x="238" y="312" width="12" height="25" fill="#a6e3a1"/>
  <text x="52" y="389" fill="#bac2de" font-size="19">Log in. Look around.</text>

  <rect x="716" y="100" width="432" height="300" rx="10" fill="#11111b" stroke="#313244"/>
  <text x="744" y="138" fill="#cdd6f4" font-size="20">/home/arman</text>
  <path d="M744 158H1120" stroke="#313244"/>
  <path d="M758 181V308M758 188H782M758 228H782M758 268H782M758 308H782" fill="none" stroke="#585b70"/>
  <rect class="selection" x="790" y="170" width="330" height="30" rx="5" fill="#cba6f7" fill-opacity=".1"/>
  <text x="804" y="196" fill="#89dceb" font-size="22">career.map</text>
  <text x="804" y="236" fill="#a6e3a1" font-size="22">projects.md</text>
  <text x="804" y="276" fill="#f9e2af" font-size="22">research.md</text>
  <text x="804" y="316" fill="#cba6f7" font-size="22">oracle.chat</text>
  <path d="M744 342H1120" stroke="#313244"/>
  <text class="command journey" x="744" y="378" fill="#89dceb" font-size="20">$ journey</text>
  <text class="command projects" x="744" y="378" fill="#a6e3a1" font-size="20">$ projects</text>
  <text class="command research" x="744" y="378" fill="#f9e2af" font-size="20">$ research</text>
  <text class="command chat" x="744" y="378" fill="#cba6f7" font-size="20">$ chat</text>
</svg>
