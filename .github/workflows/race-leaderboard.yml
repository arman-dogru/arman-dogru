name: race-leaderboard

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: race-leaderboard
  cancel-in-progress: false

jobs:
  score:
    if: startsWith(github.event.issue.title, '[RACE SCORE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate score and display name
        id: verify
        shell: bash
        env:
          PROFANITY_BLOCKLIST_GZ_B64: ${{ secrets.PROFANITY_BLOCKLIST_GZ_B64 }}
        run: |
          set +e
          python scripts/update_race_leaderboard.py "$GITHUB_EVENT_PATH" > /tmp/result.json 2> /tmp/error.txt
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "reason=$(tr '\n' ' ' < /tmp/error.txt | head -c 240)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit accepted score
        if: steps.verify.outputs.code == '0'
        run: |
          git config user.name "race-leaderboard[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json assets/race-leaderboard.svg
          if git diff --cached --quiet; then
            echo "No leaderboard change"
          else
            git commit -m "score: update Istanbul NEAT leaderboard"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Confirm accepted score
        if: steps.verify.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          SCORE=$(python -c 'import json; print(json.load(open("/tmp/result.json"))["score"])')
          RANK=$(python -c 'import json; print(json.load(open("/tmp/result.json"))["rank"])')
          gh issue comment "$ISSUE" --body "Score accepted: **${SCORE}** · current Istanbul rank **#${RANK}**. The profile leaderboard has been regenerated."
          gh issue close "$ISSUE" --reason completed
      - name: Reject invalid submission
        if: steps.verify.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REASON: ${{ steps.verify.outputs.reason }}
        run: |
          gh issue comment "$ISSUE" --body "Race submission rejected by validation. ${REASON}"
          gh issue close "$ISSUE" --reason not_planned
