name: profile-telemetry

on:
  push:
    branches: [main]
    paths-ignore:
      - assets/live.svg
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render live profile card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_live.py
      - name: Commit changed telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile telemetry"
          git push
